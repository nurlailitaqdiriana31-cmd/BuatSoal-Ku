<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');

r(--green);background:#e9f8f1;padding:7px 10px;border-radius:20px}.avatar{width:34px;height:34px;border-radius:50%;background:#eee9ff;color:var(--purple);display:grid;place-items:center;font-weight:700}.content{max-width:1440px;margin:auto;padding:34px 36px 60px}.welcome{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:25px}.eyebrow{color:var(--purple);font-size:11px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;margin-bottom:9px}.welcome h1{font:800 27px Manrope;margin:0;letter-spacing:-.7px}.welcome p{color:var(--muted);margin:9px 0 0}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;display:inline-flex;gap:8px;align-items:center;justify-content:center;transition:.18s}.btn:hover{transform:translateY(-1px);filter:brightness(.98)}.primary{background:var(--purple);color:#fff;box-shadow:0 5px 14px #6b55d92c}.secondary{background:#fff;color:#53516a;border:1px solid var(--line)}.soft{background:var(--pale);color:var(--purple)}.danger{background:#fff1f1;color:#bd4c4c}.small{padding:8px 11px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:22px}.card{background:white;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.stat{padding:18px 19px;display:flex;align-items:center;justify-content:space-between}.stat-label{font-size:12px;color:var(--muted);font-weight:600}.stat-value{font:800 25px Manrope;margin-top:9px}.stat-icon{width:43px;height:43px;border-radius:13px;background:var(--pale);display:grid;place-items:center;font-size:19px}.layout2{display:grid;grid-template-columns:1.35fr .85fr;gap:17px}.panel{padding:21px}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.panel-head h2{font:700 15px Manrope;margin:0}.muted{color:var(--muted)}.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.quick{padding:15px;border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:.2s}.quick:hover{border-color:#c9bfff;background:#fcfbff;transform:translateY(-2px)}.quick .qi{font-size:20px;margin-bottom:13px}.quick b{display:block;font-size:12px}.quick span{display:block;color:var(--muted);font-size:11px;margin-top:5px;line-height:1.4}.quote{padding:18px 20px;background:linear-gradient(120deg,#f2efff,#eff8ff);border-radius:14px;color:#4a4770;font:600 13px Manrope;line-height:1.6;margin-top:16px}.activity{display:grid;gap:0}.activity-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #f1f0f5}.activity-row:last-child{border:0}.doc-icon{height:35px;width:35px;border-radius:10px;background:#f1efff;display:grid;place-items:center;color:var(--purple)}.activity-row b{font-size:12px}.activity-row small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.activity-row em{margin-left:auto;font-style:normal;font-weight:700;color:var(--purple);font-size:11px}.page-title{margin-bottom:22px}.page-title h1{font:800 25px Manrope;margin:0}.page-title p{color:var(--muted);margin:7px 0 0}.grid{display:grid;gap:16px}.grid.two{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:repeat(3,1fr)}.form-card{padding:22px}.form-card h3{margin:0 0 18px;font:700 15px Manrope}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-weight:600;font-size:12px;color:#55546b}.field input,.field select,.field textarea,.search{width:100%;padding:10px 11px;border:1px solid #e8e7ef;border-radius:9px;background:white;color:var(--ink);outline:0}.field input:focus,.field select:focus,.field textarea:focus{border-color:#9887ea;box-shadow:0 0 0 3px #6b55d913}.field textarea{min-height:88px;resize:vertical}.drop{border:1.5px dashed #c9c4e7;border-radius:14px;background:#fcfbff;padding:27px;text-align:center;transition:.2s}.drop.over{background:#f2efff;border-color:var(--purple)}.drop .cloud{font-size:27px}.drop b{display:block;margin:9px 0 5px}.drop small{color:var(--muted)}.file-list{display:grid;gap:9px;margin-top:15px}.file-row{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:11px}.file-row .file-name{font-weight:700;font-size:12px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file-row small{display:block;color:var(--muted);margin-top:3px}.summary{padding:15px;background:#f5f3ff;border-radius:11px;margin-top:15px;line-height:1.6;color:#4f4a73}.summary h4{margin:0 0 5px}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.check{display:flex;gap:9px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:9px;font-size:12px}.check input{accent-color:var(--purple)}.table-wrap{overflow:auto}.table{border-collapse:collapse;width:100%;min-width:650px}.table th,.table td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:12px}.table th{color:var(--muted);font-size:10px;letter-spacing:.7px;text-transform:uppercase}.tag{display:inline-block;background:#f2efff;color:#6453c4;border-radius:20px;padding:5px 8px;font-size:10px;font-weight:700}.row-actions{display:flex;gap:6px}.search{max-width:290px}.question{padding:17px;border:1px solid var(--line);border-radius:12px;margin-bottom:11px}.question-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.question p{line-height:1.6;margin:10px 0}.question textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;min-height:65px}.question .answers{color:#5b5971;font-size:12px;line-height:1.75}.empty{padding:36px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--ink);margin-bottom:6px}.overlay{position:fixed;inset:0;background:#17142c80;z-index:10;display:grid;place-items:center;padding:18px}.modal{background:#fff;width:min(520px,100%);border-radius:17px;padding:24px;box-shadow:0 20px 70px #17142c40}.modal h2{font:800 19px Manrope;margin:0 0 16px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.toast{position:fixed;right:22px;bottom:22px;background:#24213a;color:white;padding:13px 17px;border-radius:11px;z-index:20;box-shadow:var(--shadow);animation:up .25s}.hidden{display:none!important}.loader{display:inline-block;width:17px;height:17px;border:2px solid #ffffff6b;border-top-color:white;border-radius:50%;animation:spin .75s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes up{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}.mobile-menu{display:none}.section-actions{display:flex;gap:9px;align-items:center}.student-card{max-width:760px;margin:auto}.student-q{padding:19px;border:1px solid var(--line);border-radius:13px;margin-bottom:12px}.student-q label{display:flex;gap:9px;margin:12px 0}.kpi-note{font-size:11px;color:var(--muted);margin-top:6px}

</style></head><body><div class="shell"><aside id="sidebar" class="sidebar"><div class="brand"><div class="logo">✦</div><div><strong>SMART AI</strong><small>QUESTION GENERATOR</small></div></div><div class="nav-label">MENU UTAMA</div><nav class="nav" id="nav"></nav><div class="side-foot"><b>✧ Guru dalam kendali</b><span>AI menyusun soal dari materi yang Anda unggah. Periksa setiap soal sebelum dibagikan.</span></div></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="mobile-menu" id="menuBtn">☰</button><div class="crumb"><strong>SMART AI</strong> <span> / </span> <span id="crumb">Dashboard</span></div></div><div class="top-right"><span class="status">● Data tersimpan otomatis</span><div class="avatar" id="avatar">G</div></div></header><div class="content" id="app"></div></main></div><div id="modalRoot"></div><div id="toastRoot"></div><input id="filePicker" type="file" multiple accept=".pdf,.doc,.docx,.ppt,.pptx,.txt" hidden>
<script>
const menus=[['Dashboard','⌂'],['Identitas Asesmen','▤'],['Upload Materi','⇧'],['Pengaturan Soal','☷'],['Editor & Review','✎'],['Kisi-kisi & Kunci','▦'],['Bank Soal','▣'],['Bagikan ke Siswa','↗'],['Hasil & Analisis','◒'],['Pengaturan','⚙']];
const fresh=()=>({active:'Dashboard',identity:{school:'',teacher:'',subject:'',level:'SMA',phase:'E',grade:'X',semester:'Ganjil',year:'2026/2027',topic:'',objective:'',outcome:'',duration:60,name:''},materials:[],questions:[],bank:[],assessments:[],students:[],settings:{apiUrl:'',model:'gpt-4o-mini',configured:false},config:{kind:'Formatif',subkind:'Evaluasi pemahaman materi',forms:['Pilihan ganda'],counts:{'Pilihan ganda':5},difficulty:{Mudah:2,Sedang:2,Sulit:1},additional:false}});
let state;try{state={...fresh(),...JSON.parse(localStorage.getItem('smartai-state')||'{}')};state.identity={...fresh().identity,...state.identity};state.settings={...fresh().settings,...state.settings};state.config={...fresh().config,...state.config};}catch{state=fresh()}
const save=()=>localStorage.setItem('smartai-state',JSON.stringify(state));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmtDate=d=>new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'short'});function toast(s){const r=document.getElementById('toastRoot');r.innerHTML=`<div class="toast">${esc(s)}</div>`;setTimeout(()=>r.innerHTML='',2800)}
function go(name){state.active=name;save();render();document.getElementById('sidebar').classList.remove('open');window.scrollTo(0,0)}
function render(){document.getElementById('nav').innerHTML=menus.map(([n,i])=>`<button class="${state.active===n?'active':''}" data-go="${n}"><span class="ni">${i}</span>${n}</button>`).join('');document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.getElementById('crumb').textContent=state.active;document.getElementById('avatar').textContent=(state.identity.teacher||'G').trim().charAt(0).toUpperCase();const pages={'Dashboard':dashboard,'Identitas Asesmen':identity,'Upload Materi':upload,'Pengaturan Soal':configuration,'Editor & Review':editor,'Kisi-kisi & Kunci':blueprint,'Bank Soal':bank,'Bagikan ke Siswa':share,'Hasil & Analisis':results,'Pengaturan':settings};document.getElementById('app').innerHTML=pages[state.active]();wire();}
const pagehead=(title,desc)=>`<div class="page-title"><div class="eyebrow">SMART AI QUESTION GENERATOR</div><h1>${title}</h1><p>${desc}</p></div>`;
function dashboard(){return `<div class="welcome"><div><div class="eyebrow">${new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div><h1>Selamat datang${state.identity.teacher?' , '+esc(state.identity.teacher):''} 👋</h1><p>${state.identity.school?esc(state.identity.school)+' · ':''}Membuat Soal Lebih Mudah, Pembelajaran Lebih Bermakna.</p></div><button class="btn primary" data-go="Identitas Asesmen">＋ Buat Soal Baru</button></div><div class="stats"><div class="card stat"><div><div class="stat-label">Soal dibuat</div><div class="stat-value">${state.bank.length+state.questions.length}</div></div><div class="stat-icon">✎</div></div><div class="card stat"><div><div class="stat-label">Materi tersimpan</div><div class="stat-value">${state.materials.length}</div></div><div class="stat-icon">▤</div></div><div class="card stat"><div><div class="stat-label">Asesmen dibagikan</div><div class="stat-value">${state.assessments.length}</div></div><div class="stat-icon">↗</div></div><div class="card stat"><div><div class="stat-label">Siswa mengerjakan</div><div class="stat-value">${state.students.length}</div></div><div class="stat-icon">♙</div></div></div><div class="layout2"><div class="card panel"><div class="panel-head"><h2>Mulai dengan cepat</h2><span class="muted" style="font-size:11px">Alur kerja guru</span></div><div class="quick-grid"><div class="quick" data-go="Identitas Asesmen"><div class="qi">📝</div><b>Buat soal baru</b><span>Isi identitas dan tujuan asesmen</span></div><div class="quick" data-go="Upload Materi"><div class="qi">📚</div><b>Upload materi</b><span>Tambahkan sumber soal Anda</span></div><div class="quick" data-go="Bank Soal"><div class="qi">🗂️</div><b>Lihat bank soal</b><span>Cari dan gunakan soal tersimpan</span></div></div><div class="quote">“Membuat Soal Lebih Mudah, Pembelajaran Lebih Bermakna.”</div></div><div class="card panel"><div class="panel-head"><h2>Aktivitas terbaru</h2><button class="btn secondary small" data-go="Bank Soal">Lihat semua</button></div><div class="activity">${[...state.assessments,...state.bank].slice(-5).reverse().map(x=>`<div class="activity-row"><div class="doc-icon">▤</div><div><b>${esc(x.name||x.title||'Asesmen baru')}</b><small>${fmtDate(x.date||Date.now())} · ${esc(x.subject||'Materi tersimpan')}</small></div><em>${x.questions?.length||0} soal</em></div>`).join('')||'<div class="empty"><b>Belum ada aktivitas</b>Soal dan asesmen yang Anda buat muncul di sini.</div>'}</div></div></div>`}
const levels=['PAUD/TK','SD','SMP','SMA','SMK'];function identity(){const i=state.identity;return `${pagehead('Identitas asesmen','Lengkapi informasi ini agar soal sesuai dengan konteks dan peserta didik.') }<div class="card form-card"><h3>Informasi asesmen</h3><form id="identityForm"><div class="fields">${field('Nama sekolah','school',i.school)}${field('Nama guru','teacher',i.teacher)}${field('Mata pelajaran','subject',i.subject)}${selectField('Jenjang pendidikan','level',levels,i.level)}${selectField('Fase','phase',['A','B','C','D','E','F'].map(x=>'Fase '+x),'Fase '+i.phase)}${selectField('Kelas','grade',gradeOptions(i.level,i.phase),i.grade)}${selectField('Semester','semester',['Ganjil','Genap'],i.semester)}${field('Tahun pelajaran','year',i.year)}${field('Bab / topik pembelajaran','topic',i.topic)}${field('Nama asesmen','name',i.name)}${field('Alokasi waktu (menit)','duration',i.duration,'number')}<div class="field full"><label>Tujuan pembelajaran</label><textarea name="objective" placeholder="Apa yang diharapkan dikuasai siswa?">${esc(i.objective)}</textarea></div><div class="field full"><label>Capaian pembelajaran</label><textarea name="outcome" placeholder="Tuliskan capaian pembelajaran terkait">${esc(i.outcome)}</textarea></div></div><div style="display:flex;justify-content:flex-end;margin-top:18px"><button class="btn primary">Simpan & lanjutkan →</button></div></form></div>`}
function gradeOptions(l,p){let map={'PAUD/TK':['Kelompok A','Kelompok B'],SD:['I','II','III','IV','V','VI'],SMP:['VII','VIII','IX'],SMA:['X','XI','XII'],SMK:['X','XI','XII','XIII']};p=String(p).replace('Fase ','');const phase={'A':['I','II'],B:['III','IV'],C:['V','VI'],D:['VII','VIII','IX'],E:['X','XI'],F:l==='SMK'?['XI','XII','XIII']:['XI','XII']}[p]||map[l]||[];return phase.filter(x=>map[l]?.includes(x)).length?phase.filter(x=>map[l]?.includes(x)):map[l]||[]}
function field(label,name,value='',type='text'){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}"></div>`}function selectField(label,name,opts,val){let vv=String(val);return `<div class="field"><label>${label}</label><select name="${name}">${opts.map(o=>`<option ${String(o)===vv?'selected':''}>${o}</option>`).join('')}</select></div>`}
function upload(){return `${pagehead('Upload materi pembelajaran','Materi yang Anda unggah menjadi sumber utama untuk setiap soal yang dibuat.') }<div class="grid two"><div class="card form-card"><h3>Tambahkan materi</h3><div class="field" style="margin-bottom:14px"><label>Judul / nama materi</label><input id="materialTitle" placeholder="Contoh: Sistem Pencernaan Manusia"></div><div class="drop" id="drop"><div class="cloud">☁️</div><b>Seret file ke sini</b><small>atau pilih file dari perangkat · PDF, DOC, DOCX, PPT, PPTX, TXT</small><div style="margin-top:14px"><button type="button" class="btn secondary small" id="pickFiles">Pilih file</button></div><input id="localFiles" type="file" multiple accept=".pdf,.doc,.docx,.ppt,.pptx,.txt" hidden></div><div class="file-list">${state.materials.map(m=>`<div class="file-row"><div class="doc-icon">▤</div><div class="file-name">${esc(m.title)}<small>${esc(m.name)} · ${Math.max(1,Math.round((m.size||0)/1024))} KB · ${esc(m.status||'Siap')}</small></div><button class="btn danger small" data-remove-material="${m.id}">Hapus</button></div>`).join('')||'<div class="empty">Belum ada materi yang diunggah.</div>'}</div></div><div class="card form-card"><h3>Analisis materi</h3>${state.materials.length?`<div class="summary"><h4>Ringkasan sumber</h4>${state.materials.map(m=>`<p><b>${esc(m.title)}</b><br>${esc(m.summary||'Materi siap digunakan sebagai referensi pembuatan soal.')}</p>`).join('')}</div><p class="muted" style="font-size:12px;line-height:1.65">AI menggunakan isi dokumen ini sebagai acuan utama. Sumber halaman/bagian akan ditambahkan pada soal jika tersedia.</p><label class="check"><input type="checkbox" id="allowExternal" ${state.config.additional?'checked':''}> Izinkan referensi pengetahuan umum tambahan</label>`:'<div class="empty"><b>Ringkasan akan tampil di sini</b>Unggah materi untuk melihat teks yang berhasil diekstrak dan dianalisis.</div>'}<div style="margin-top:16px"><button class="btn soft" id="analyzeBtn" ${state.materials.length?'':'disabled'}>✦ Analisis materi</button></div></div></div>`}
function configuration(){let c=state.config, forms=['Pilihan ganda','Pilihan ganda kompleks','Benar atau salah','Menjodohkan','Isian singkat','Melengkapi kalimat','Uraian atau esai','Studi kasus','Soal berbasis cerita','Soal HOTS'];return `${pagehead('Pengaturan pembuatan soal','Tentukan bentuk soal, jenis asesmen, dan sebaran kesulitan.') }<div class="grid two"><div class="card form-card"><h3>Jenis asesmen</h3><div class="fields">${selectField('Kategori','kind',['Diagnostik','Formatif','Sumatif','Berdiferensiasi'],c.kind)}${selectField('Fokus asesmen','subkind',{'Diagnostik':['Diagnostik kognitif','Diagnostik nonkognitif','Pemetaan kemampuan awal siswa'],'Formatif':['Evaluasi pemahaman materi','Latihan pembelajaran','Kuis interaktif','Evaluasi per submateri'],'Sumatif':['Ulangan harian','Penilaian tengah semester','Penilaian akhir semester','Evaluasi akhir bab'],'Berdiferensiasi':['Soal tingkat dasar','Soal tingkat menengah','Soal tingkat lanjut']}[c.kind]||['Evaluasi pemahaman materi'],c.subkind)}</div><h3 style="margin-top:22px">Bentuk soal & jumlah</h3><div class="options">${forms.map(f=>`<label class="check"><input type="checkbox" data-form="${f}" ${c.forms.includes(f)?'checked':''}>${f}<input aria-label="Jumlah ${f}" type="number" min="0" max="50" value="${c.counts[f]||0}" data-count="${f}" style="margin-left:auto;width:58px;padding:5px;border:1px solid #e8e7ef;border-radius:6px" /></label>`).join('')}</div></div><div class="card form-card"><h3>Tingkat kesulitan</h3><p class="muted" style="font-size:12px">Sesuaikan bahasa dan kompleksitas dengan jenjang ${esc(state.identity.level)} kelas ${esc(state.identity.grade)}.</p><div class="fields">${['Mudah','Sedang','Sulit'].map((d,n)=>`<div class="field"><label>${d} (${['LOTS','MOTS','HOTS'][n]})</label><input type="number" min="0" max="50" data-diff="${d}" value="${c.difficulty[d]||0}"></div>`).join('')}</div><div class="summary"><b>Jumlah soal yang diminta: ${Object.values(c.counts).reduce((a,b)=>a+Number(b||0),0)}</b><br>Jika materi belum mencukupi, aplikasi akan memberi tahu dan Anda dapat menambahkan materi atau mengaktifkan sumber tambahan.</div><button class="btn primary" id="generateBtn" style="margin-top:17px;width:100%">✦ GENERATE SOAL DENGAN AI</button><p class="muted" style="font-size:11px;text-align:center">${state.materials.length} materi siap · ${esc(state.identity.subject||'Mata pelajaran belum diisi')}</p></div></div>`}
function editor(){return `${pagehead('Editor & review soal','Tinjau sumber, kunci jawaban, dan pembahasan. Perubahan tersimpan otomatis.') }<div class="section-actions" style="margin-bottom:15px"><button class="btn primary" id="saveBank">Simpan ke bank soal</button><button class="btn secondary" id="reshuffle">↻ Acak urutan</button><button class="btn secondary" id="preview">Pratinjau</button><button class="btn secondary" id="print">Cetak / PDF</button><button class="btn secondary" id="exportJson">Ekspor data</button><button class="btn secondary" id="exportWord">Ekspor Word</button></div><div id="questions">${state.questions.length?state.questions.map(questionCard).join(''):'<div class="card empty"><b>Belum ada soal untuk ditinjau</b>Unggah materi, isi pengaturan, lalu generate soal. Anda juga dapat menambahkan soal manual.<div style="margin-top:14px"><button class="btn soft" id="manual">＋ Tambah soal manual</button></div></div>'}</div>${state.questions.length?'<button class="btn soft" id="manual">＋ Tambah soal manual</button>':''}`}
function questionCard(q,n){return `<div class="card question" data-qid="${q.id}"><div class="question-top"><div><span class="tag">Soal ${n+1} · ${esc(q.type||'Pilihan ganda')} · ${esc(q.difficulty||'Sedang')}</span></div><div class="row-actions"><button class="btn secondary small" data-replace="${q.id}">↻ Ganti</button><button class="btn danger small" data-delete-q="${q.id}">Hapus</button></div></div><div class="field"><label>Pertanyaan</label><textarea data-edit="text" data-id="${q.id}">${esc(q.text)}</textarea></div>${q.options?.length?`<div class="answers"><b>Opsi jawaban</b>${q.options.map((o,i)=>`<div style="display:flex;align-items:center;gap:8px;margin-top:6px">${String.fromCharCode(65+i)}. <input data-option="${q.id}" data-index="${i}" value="${esc(o)}" style="flex:1;padding:7px;border:1px solid #e8e7ef;border-radius:7px"></div>`).join('')}</div>`:''}<div class="fields" style="margin-top:12px"><div class="field"><label>Kunci jawaban</label><input data-edit="answer" data-id="${q.id}" value="${esc(q.answer)}"></div><div class="field"><label>Sumber materi</label><input data-edit="source" data-id="${q.id}" value="${esc(q.source)}"></div><div class="field full"><label>Pembahasan</label><textarea data-edit="explanation" data-id="${q.id}">${esc(q.explanation)}</textarea></div></div><small class="muted">Indikator: ${esc(q.indicator||'—')} · Level kognitif: ${esc(q.cognitive||'C2')}</small></div>`}
function blueprint(){return `${pagehead('Kisi-kisi & kunci jawaban','Kisi-kisi dibuat dari soal yang sedang direview. Cetak untuk menyimpan sebagai dokumen.') }<div class="card panel"><div class="panel-head"><h2>Kisi-kisi soal (${state.questions.length})</h2><button class="btn secondary small" id="print">Cetak kisi-kisi</button></div><div class="table-wrap"><table class="table"><thead><tr><th>No.</th><th>Capaian pembelajaran</th><th>Tujuan pembelajaran</th><th>Materi</th><th>Indikator</th><th>Bentuk</th><th>Level</th><th>Kesulitan</th></tr></thead><tbody>${state.questions.map((q,i)=>`<tr><td>${i+1}</td><td>${esc(state.identity.outcome||'—')}</td><td>${esc(state.identity.objective||'—')}</td><td>${esc(state.identity.topic||'—')}</td><td>${esc(q.indicator||'—')}</td><td>${esc(q.type||'—')}</td><td>${esc(q.cognitive||'—')}</td><td>${esc(q.difficulty||'—')}</td></tr>`).join('')||'<tr><td colspan="8">Belum ada kisi-kisi.</td></tr>'}</tbody></table></div></div><div class="card panel" style="margin-top:16px"><div class="panel-head"><h2>Kunci jawaban & pembahasan</h2><button class="btn secondary small" id="print">Cetak kunci</button></div>${state.questions.map((q,i)=>`<div class="activity-row"><b style="min-width:25px">${i+1}.</b><div><b>${esc(q.answer||'Belum diisi')}</b><small>${esc(q.explanation||'Pembahasan belum diisi')}</small></div><span class="tag">${esc(q.type)}</span></div>`).join('')||'<div class="empty">Belum ada kunci jawaban.</div>'}</div>`}
function bank(){return `${pagehead('Bank soal','Cari, simpan, dan gunakan kembali soal yang telah dibuat.') }<div class="card panel"><div class="panel-head"><h2>Soal tersimpan (${state.bank.length})</h2><input id="bankSearch" class="search" placeholder="Cari soal, materi, mapel..."></div><div id="bankList">${bankRows(state.bank)}</div></div>`}

function share(){return `${pagehead('Bagikan soal kepada siswa','Buat tautan asesmen yang bisa dibuka siswa tanpa akun guru.') }<div class="grid two"><div class="card form-card"><h3>Terbitkan asesmen</h3>${state.questions.length?`<div class="summary"><b>${esc(state.identity.name||'Asesmen baru')}</b><br>${state.questions.length} soal · ${esc(state.identity.subject||'')}</div><div class="fields" style="margin-top:14px">${field('Batas waktu (menit)','shareTime',state.identity.duration,'number')}<div class="field"><label>Tampilkan nilai</label><select id="scorePolicy"><option value="after">Setelah dikumpulkan</option><option value="teacher">Setelah guru mengizinkan</option></select></div></div><div class="options" style="margin-top:14px"><label class="check"><input type="checkbox" id="once" checked>Satu kali pengerjaan</label><label class="check"><input type="checkbox" id="shuffleQ">Acak urutan soal</label><label class="check"><input type="checkbox" id="shuffleA">Acak pilihan jawaban</label><label class="check"><input type="checkbox" id="showExplain">Tampilkan pembahasan</label></div><button class="btn primary" id="publish" style="margin-top:16px">↗ Buat link asesmen</button>`:'<div class="empty"><b>Belum ada soal siap dibagikan</b>Buat dan simpan soal terlebih dahulu di Editor & Review.</div>'}</div><div class="card form-card"><h3>Asesmen aktif</h3>${state.assessments.map(a=>`<div class="activity-row"><div class="doc-icon">↗</div><div><b>${esc(a.name)}</b><small>Kode akses: ${esc(a.code)} · ${a.questions.length} soal</small></div><button class="btn soft small" data-copy="${a.id}">Salin link</button></div>`).join('')||'<div class="empty">Link asesmen yang diterbitkan akan tampil di sini.</div>'}</div></div>`}
function results(){const s=state.students;const avg=s.length?Math.round(s.reduce((a,x)=>a+x.score,0)/s.length):0;return `${pagehead('Hasil & analisis asesmen','Pantau jawaban siswa, pencapaian kelas, dan area yang perlu ditindaklanjuti.') }<div class="stats"><div class="card stat"><div><div class="stat-label">Siswa mengerjakan</div><div class="stat-value">${s.length}</div></div><div class="stat-icon">♙</div></div><div class="card stat"><div><div class="stat-label">Rata-rata nilai</div><div class="stat-value">${s.length?avg:'—'}</div></div><div class="stat-icon">◒</div></div><div class="card stat"><div><div class="stat-label">Nilai tertinggi</div><div class="stat-value">${s.length?Math.max(...s.map(x=>x.score)):'—'}</div></div><div class="stat-icon">↗</div></div><div class="card stat"><div><div class="stat-label">Ketuntasan (≥75)</div><div class="stat-value">${s.length?Math.round(s.filter(x=>x.score>=75).length/s.length*100)+'%':'—'}</div></div><div class="stat-icon">✓</div></div></div><div class="card panel"><div class="panel-head"><h2>Hasil siswa</h2><button class="btn secondary small" id="exportResults">Ekspor CSV</button></div>${s.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Nama siswa</th><th>Kelas</th><th>Asesmen</th><th>Benar</th><th>Salah</th><th>Kosong</th><th>Nilai</th></tr></thead><tbody>${s.map(x=>`<tr><td>${esc(x.student)}</td><td>${esc(x.className)}</td><td>${esc(x.assessment)}</td><td>${x.correct}</td><td>${x.wrong}</td><td>${x.blank}</td><td><b>${x.score}</b></td></tr>`).join('')}</tbody></table></div><div class="summary" style="margin-top:16px">${s.filter(x=>x.score<75).length?`<b>Tindak lanjut:</b> ${s.filter(x=>x.score<75).length} siswa belum mencapai nilai 75. Tinjau kembali materi ${esc(state.identity.topic||'yang diujikan')} dan berikan latihan penguatan.`:'Semua siswa mencapai nilai tuntas.'}</div>`:'<div class="empty"><b>Belum ada hasil siswa</b>Terbitkan asesmen dan bagikan tautan agar respons siswa tercatat di perangkat ini.</div>'}</div>`}
function settings(){return `${pagehead('Pengaturan aplikasi','Atur koneksi model AI dan identitas sekolah Anda.') }<div class="grid two"><div class="card form-card"><h3>Integrasi AI (disimpan di server)</h3><div class="field" style="margin-bottom:12px"><label>URL endpoint kompatibel OpenAI</label><input id="apiUrl" placeholder="https://api.openai.com/v1/chat/completions" value="${esc(state.settings.apiUrl)}"></div><div class="field" style="margin-bottom:12px"><label>Nama model</label><input id="model" value="${esc(state.settings.model)}"></div><div class="field" style="margin-bottom:12px"><label>API key</label><input id="apiKey" type="password" autocomplete="new-password" placeholder="${state.settings.configured?'Kunci sudah tersimpan di server · isi untuk mengganti':'Tempel API key untuk disimpan di server'}"></div><button class="btn primary" id="saveSettings">Simpan pengaturan</button><div class="summary">Kunci API dikirim langsung ke backend untuk disimpan di berkas konfigurasi lokal di luar folder publik. Kunci tidak disimpan pada browser atau halaman siswa. Backend lokal menyimpan data materi, soal, dan asesmen dalam berkas JSON.</div></div><div class="card form-card"><h3>Data aplikasi</h3><p class="muted" style="line-height:1.6">Data di browser tersimpan otomatis pada perangkat ini. Gunakan ekspor cadangan untuk menyimpan salinan, atau impor salinan untuk pemulihan.</p><div class="section-actions"><button class="btn secondary" id="backup">Unduh cadangan JSON</button><button class="btn secondary" id="restore">Pulihkan cadangan</button><input type="file" id="restoreInput" accept=".json" hidden></div><div style="margin-top:18px"><button class="btn secondary" id="loginInfo">Profil guru & sekolah</button></div></div></div>`}
function wire(){document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));const f=document.getElementById('identityForm');if(f)f.onsubmit=e=>{e.preventDefault();Object.assign(state.identity,Object.fromEntries(new FormData(f)));state.identity.duration=Number(state.identity.duration);save();toast('Identitas asesmen disimpan');go('Upload Materi')};let lev=document.querySelector('[name=level]'),pha=document.querySelector('[name=phase]'),gr=document.querySelector('[name=grade]');const refreshGrade=()=>{if(!gr)return;let old=gr.value;gr.innerHTML=gradeOptions(lev?.value,pha?.value).map(x=>'<option>'+x+'</option>').join('');if([...gr.options].some(o=>o.value===old))gr.value=old};if(lev)lev.onchange=refreshGrade;if(pha)pha.onchange=refreshGrade;document.querySelectorAll('[data-form]').forEach(e=>e.onchange=()=>{let f=e.dataset.form;if(e.checked&&!state.config.forms.includes(f))state.config.forms.push(f);else state.config.forms=state.config.forms.filter(x=>x!==f);save()});document.querySelectorAll('[data-count]').forEach(e=>e.onchange=()=>{state.config.counts[e.dataset.count]=Number(e.value);save()});document.querySelectorAll('[data-diff]').forEach(e=>e.onchange=()=>{state.config.difficulty[e.dataset.diff]=Number(e.value);save()});let kind=document.querySelector('[name=kind]');if(kind)kind.onchange=()=>{state.config.kind=kind.value;render()};let sub=document.querySelector('[name=subkind]');if(sub)sub.onchange=()=>{state.config.subkind=sub.value;save()};const picker=document.getElementById('localFiles'),drop=document.getElementById('drop');if(drop){document.getElementById('pickFiles').onclick=()=>picker.click();picker.onchange=()=>addFiles(picker.files);drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};drop.ondragleave=()=>drop.classList.remove('over');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');addFiles(e.dataTransfer.files)};}document.querySelectorAll('[data-remove-material]').forEach(b=>b.onclick=()=>{state.materials=state.materials.filter(m=>m.id!==b.dataset.removeMaterial);save();render()});const analyze=document.getElementById('analyzeBtn');if(analyze)analyze.onclick=async()=>{analyze.disabled=true;analyze.innerHTML='<span class="loader"></span> Menganalisis…';try{const r=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({materials:state.materials.map(m=>({title:m.title,text:m.text}))})});if(!r.ok){const x=await r.json();throw Error(x.error||'Analisis gagal')}const x=await r.json();state.materials.forEach(m=>m.summary=(x.summary||'')+'\n\nKonsep: '+(x.concepts||[]).join(', ')+'\nSubmateri: '+(x.subtopics||[]).join(', '));save();render();toast('Analisis materi AI selesai')}catch(e){analyze.disabled=false;analyze.textContent='✦ Analisis materi';toast(e.message||'Koneksi AI dibutuhkan untuk menganalisis materi')}};const ext=document.getElementById('allowExternal');if(ext)ext.onchange=()=>{state.config.additional=ext.checked;save()};let gen=document.getElementById('generateBtn');if(gen)gen.onclick=generate;document.querySelectorAll('[data-edit]').forEach(e=>e.onchange=()=>{let q=state.questions.find(q=>q.id===e.dataset.id);if(q){q[e.dataset.edit]=e.value;save()}});document.querySelectorAll('[data-option]').forEach(e=>e.onchange=()=>{let q=state.questions.find(q=>q.id===e.dataset.option);if(q){q.options[Number(e.dataset.index)]=e.value;save()}});document.querySelectorAll('[data-delete-q]').forEach(b=>b.onclick=()=>{state.questions=state.questions.filter(q=>q.id!==b.dataset.deleteQ);save();render()});document.querySelectorAll('[data-replace]').forEach(b=>b.onclick=()=>replaceQuestion(b.dataset.replace));let manual=document.getElementById('manual');if(manual)manual.onclick=()=>{state.questions.push({id:crypto.randomUUID(),text:'Pertanyaan baru',answer:'',source:'',explanation:'',type:'Uraian atau esai',difficulty:'Sedang'});save();render()};const saveBank=document.getElementById('saveBank');if(saveBank)saveBank.onclick=saveToBank;let sh=document.getElementById('reshuffle');if(sh)sh.onclick=()=>{state.questions.sort(()=>Math.random()-.5);save();render()};['preview','print'].forEach(id=>{let e=document.getElementById(id);if(e)e.onclick=()=>window.print()});let ex=document.getElementById('exportJson');if(ex)ex.onclick=exportQuestions;let wd=document.getElementById('exportWord');if(wd)wd.onclick=exportWord;document.querySelectorAll('[data-delete-bank]').forEach(b=>b.onclick=()=>{state.bank=state.bank.filter(x=>x.id!==b.dataset.deleteBank);save();render()});document.querySelectorAll('[data-load-bank]').forEach(b=>b.onclick=()=>{let item=state.bank.find(x=>x.id===b.dataset.loadBank);if(item?.questions){state.questions=structuredClone(item.questions);save();go('Editor & Review')}else{state.questions.push({...item,id:crypto.randomUUID()});save();toast('Soal ditambahkan ke editor')}});let bs=document.getElementById('bankSearch');if(bs)bs.oninput=()=>{const q=bs.value.toLowerCase();document.getElementById('bankList').innerHTML=bankRows(state.bank.filter(x=>JSON.stringify(x).toLowerCase().includes(q)))};let publish=document.getElementById('publish');if(publish)publish.onclick=publishAssessment;document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>navigator.clipboard?.writeText(location.origin+location.pathname+'?assessment='+b.dataset.copy).then(()=>toast('Link asesmen disalin')).catch(()=>toast('Link: '+b.dataset.copy)));let set=document.getElementById('saveSettings');if(set)set.onclick=async()=>{const apiUrl=document.getElementById('apiUrl').value,model=document.getElementById('model').value,apiKey=document.getElementById('apiKey').value;try{const r=await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({apiUrl,model,apiKey})});if(!r.ok)throw 0;const result=await r.json();state.settings.apiUrl=apiUrl;state.settings.model=model;state.settings.configured=result.configured;save();toast(result.configured?'Koneksi AI tersimpan aman di server':'Kunci belum diatur; endpoint dan model tersimpan');render()}catch{toast('Server belum berjalan. Jalankan node server.js untuk menyimpan koneksi AI.')}};let backup=document.getElementById('backup');if(backup)backup.onclick=()=>download('smart-ai-backup.json',JSON.stringify(state,null,2),'application/json');let restore=document.getElementById('restore');if(restore)restore.onclick=()=>document.getElementById('restoreInput').click();let ri=document.getElementById('restoreInput');if(ri)ri.onchange=async()=>{try{state={...fresh(),...JSON.parse(await ri.files[0].text())};save();render();toast('Cadangan berhasil dipulihkan')}catch{toast('Berkas cadangan tidak valid')}};let lp=document.getElementById('loginInfo');if(lp)lp.onclick=()=>go('Identitas Asesmen');let er=document.getElementById('exportResults');if(er)er.onclick=()=>download('hasil-asesmen.csv','Nama,Kelas,Asesmen,Benar,Salah,Kosong,Nilai\n'+state.students.map(s=>[s.student,s.className,s.assessment,s.correct,s.wrong,s.blank,s.score].join(',')).join('\n'),'text/csv')}
async function addFiles(files){for(const f of files){let text='';const ext=f.name.split('.').pop().toLowerCase();try{if(ext==='txt')text=await f.text();else if(ext==='pdf'){let raw=await f.arrayBuffer();text=new TextDecoder('latin1').decode(raw).match(/\(([^()]*)\)\s*Tj/g)?.map(x=>x.slice(1,-4)).join(' ')||'';}else text='';}catch{}let m={id:crypto.randomUUID(),title:document.getElementById('materialTitle').value.trim()||f.name.replace(/\.[^.]+$/,''),name:f.name,size:f.size,type:ext,text,summary:'',status:text?'Teks berhasil diekstrak':'File tersimpan; ekstraksi format ini membutuhkan layanan server.'};state.materials.push(m);if(!text&&['docx','pptx'].includes(ext)){let fd=new FormData();fd.append('file',f);try{let r=await fetch('/api/extract',{method:'POST',body:fd});if(r.ok){let d=await r.json();m.text=d.text||'';m.status='Teks berhasil diekstrak'}}catch{}}}save();render();toast(`${files.length} file ditambahkan`)}
async function generate(){if(!state.materials.length){toast('Unggah materi terlebih dahulu');go('Upload Materi');return}let total=Object.values(state.config.counts).reduce((a,b)=>a+Number(b||0),0);if(!total){toast('Atur jumlah soal minimal satu');return}let btn=document.getElementById('generateBtn');btn.disabled=true;btn.innerHTML='<span class="loader"></span> Menganalisis materi…';const payload={identity:state.identity,config:state.config,materials:state.materials.map(m=>({title:m.title,name:m.name,text:m.text}))};try{const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(r.ok){let d=await r.json();state.questions=d.questions.map(q=>({id:q.id||crypto.randomUUID(),...q}));save();if(d.warning)toast(d.warning);go('Editor & Review');return}let err=await r.json().catch(()=>({error:'Backend AI belum tersedia'}));toast(err.error||'AI tidak dapat membuat soal');}catch{toast('Backend belum berjalan. Jalankan server dengan `node server.js`.')}finally{if(document.body.contains(btn)){btn.disabled=false;btn.innerHTML='✦ GENERATE SOAL DENGAN AI'}}}
async function replaceQuestion(id){const q=state.questions.find(q=>q.id===id);try{const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identity:state.identity,config:{...state.config,counts:{[q.type||'Pilihan ganda']:1}},materials:state.materials.map(m=>({title:m.title,text:m.text})),settings:state.settings,avoid:[q.text]})});if(!r.ok)throw 0;const d=await r.json();state.questions=state.questions.map(x=>x.id===id?{...d.questions[0],id}:x);save();render()}catch{toast('Koneksi AI dibutuhkan untuk mengganti soal')}}
function saveToBank(){if(!state.questions.length){toast('Belum ada soal untuk disimpan');return}let item={id:crypto.randomUUID(),name:state.identity.name||state.identity.topic||'Asesmen baru',subject:state.identity.subject,grade:state.identity.grade,topic:state.identity.topic,kind:state.config.kind,questions:structuredClone(state.questions),date:new Date().toISOString()};state.bank.unshift(item);state.assessments.unshift(item);save();toast('Soal tersimpan di bank soal')}
function publishAssessment(){let a={id:crypto.randomUUID(),code:Math.random().toString(36).slice(2,8).toUpperCase(),name:state.identity.name||'Asesmen',questions:structuredClone(state.questions),date:new Date().toISOString(),time:Number(document.querySelector('[name=shareTime]')?.value||60),oneAttempt:!!document.getElementById('once')?.checked,showScore:document.getElementById('scorePolicy')?.value||'teacher',showExplanation:!!document.getElementById('showExplain')?.checked};if(document.getElementById('shuffleQ')?.checked)a.questions.sort(()=>Math.random()-.5);if(document.getElementById('shuffleA')?.checked)a.questions.forEach(q=>{if(q.options?.length){let a=String(q.answer||'').trim().toLowerCase();if(/^[a-e]$/.test(a))q.answer=q.options[a.charCodeAt(0)-97]||q.answer;q.options.sort(()=>Math.random()-.5)}});state.assessments.unshift(a);save();fetch('/api/assessments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(a)}).catch(()=>{});render();toast('Asesmen diterbitkan. Salin link pada panel asesmen aktif.')}
function exportQuestions(){download('soal-'+(state.identity.name||'asesmen').replace(/[^\w-]+/g,'-')+'.json',JSON.stringify({identity:state.identity,questions:state.questions},null,2),'application/json')}
function exportWord(){let html='<html><meta charset="utf-8"><body><h1>'+esc(state.identity.name||'Asesmen')+'</h1><p>'+esc(state.identity.subject||'')+' · Kelas '+esc(state.identity.grade)+'</p>'+state.questions.map((q,i)=>'<h3>'+ (i+1)+'. '+esc(q.text)+'</h3>'+(q.options||[]).map((o,j)=>'<p>'+String.fromCharCode(65+j)+'. '+esc(o)+'</p>').join('')+'<p><b>Kunci:</b> '+esc(q.answer)+'</p><p>'+esc(q.explanation)+'</p>').join('')+'</body></html>';download('soal.doc',html,'application/msword')}
function download(name,body,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([body],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function studentPage(a){document.querySelector('.sidebar').classList.add('hidden');document.querySelector('.topbar').classList.add('hidden');document.getElementById('app').innerHTML=`<div class="student-card">${pagehead(esc(a.name),'Jawab soal dengan teliti. Hasil akan dikirim kepada guru.') }<div id="studentIntro" class="card form-card"><h3>Identitas siswa</h3><div class="fields">${field('Nama lengkap','student')}${field('Kelas','className')}${field('Nomor absen (opsional)','roll')}</div><button class="btn primary" id="startExam" style="margin-top:16px">Mulai mengerjakan →</button></div><form id="studentExam" class="hidden">${a.questions.map((q,i)=>`<div class="card student-q"><span class="tag">Soal ${i+1}</span><p>${esc(q.text)}</p>${q.options?.length?q.options.map(o=>`<label><input type="radio" name="q${i}" value="${esc(o)}">${esc(o)}</label>`).join(''):`<textarea name="q${i}" placeholder="Tulis jawaban Anda" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:9px"></textarea>`}</div>`).join('')}<button class="btn primary">Kirim jawaban</button></form></div>`;document.getElementById('startExam').onclick=()=>{document.getElementById('studentIntro').classList.add('hidden');document.getElementById('studentExam').classList.remove('hidden')};document.getElementById('studentExam').onsubmit=e=>{e.preventDefault();let fd=new FormData(e.target),correct=0,blank=0;a.questions.forEach((q,i)=>{let ans=fd.get('q'+i);if(!ans)blank++;else{let expected=String(q.answer||'').trim().toLowerCase(),chosen=String(ans).trim().toLowerCase();if(q.options?.length){let ix=q.options.findIndex(o=>String(o).trim().toLowerCase()===expected);if(ix>=0)expected=String(q.options[ix]).trim().toLowerCase();else if(/^[a-e]$/.test(expected))expected=String(q.options[expected.charCodeAt(0)-97]||expected).trim().toLowerCase()}if(chosen===expected)correct++}});let wrong=a.questions.length-correct-blank,score=Math.round(correct/a.questions.length*100);state.students.push({student:fd.get('student'),className:fd.get('className'),assessment:a.name,correct,wrong,blank,score});save();fetch('/api/assessments/'+a.id+'/submissions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student:fd.get('student'),className:fd.get('className'),assessment:a.name,correct,wrong,blank,score})}).catch(()=>{});document.getElementById('app').innerHTML=`<div class="card form-card student-card"><div class="eyebrow">JAWABAN TERKIRIM</div><h1>Terima kasih, ${esc(fd.get('student'))}!</h1><p>Jawaban Anda telah tercatat dan dapat dilihat guru.</p>${a.showScore==='after'?`<div class="summary">Nilai: <b>${score}</b> · ${correct} benar · ${wrong} salah · ${blank} kosong</div>`:''}</div>`}}
async function init(){try{const h=await fetch('/api/health');if(h.ok){const x=await h.json();state.settings.configured=x.aiConfigured;}const rr=await fetch('/api/submissions');if(rr.ok)state.students=await rr.json()}catch{}let id=new URLSearchParams(location.search).get('assessment');if(id){let a=state.assessments.find(x=>x.id===id||x.code===id);try{const rr=await fetch('/api/assessments/'+encodeURIComponent(id));if(rr.ok)a=await rr.json()}catch{}if(a){studentPage(a);return}}render()}
init();
</script></body></html>
